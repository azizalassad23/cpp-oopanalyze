name = "cpp-oopanalyze-api"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Pengaturan yang boleh dilihat publik. Untuk mengubah batas kuota atau model,
# cukup ubah di sini lalu `npm run deploy` — tidak perlu menyentuh kode.
[vars]
GEMINI_MODEL = "gemini-2.5-flash"
BATAS_HARIAN_MURID = "30"
BATAS_HARIAN_TOTAL = "400"
ASAL_DIIZINKAN = "https://azizalassad23.github.io,http://localhost:5173"

# Penyimpanan penghitung kuota harian.
# Dibuat dengan: npx wrangler kv namespace create KUOTA
[[kv_namespaces]]
binding = "KUOTA"
id = "e94ea3f6ae4c4db9b4c7305726ab2eaf"

# CATATAN: GEMINI_API_KEY dan KODE_AKSES TIDAK ditulis di berkas ini.
# Keduanya disimpan sebagai secret:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put KODE_AKSES
